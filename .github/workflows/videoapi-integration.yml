name: VideoAPI integration gate

on:
  pull_request:
    paths:
      - "editor_ultra_app/videoapi.py"
      - "editor_ultra_app/server.py"
      - "editor_ultra_app/ui.html"
      - "tests/test_videoapi.py"
      - "tests/test_app_server.py"
      - ".github/workflows/videoapi-integration.yml"
  push:
    branches:
      - main
    paths:
      - "editor_ultra_app/videoapi.py"
      - "editor_ultra_app/server.py"
      - "editor_ultra_app/ui.html"
      - "tests/test_videoapi.py"

permissions:
  contents: read

jobs:
  videoapi-and-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install runtime and test dependencies
        run: |
          python -m pip install -r requirements-app.txt
          python -m pip install "pytest>=8,<10"
      - name: Verify server code compiles
        run: python -m compileall -q editor_ultra_app
      - name: Test app bridge and VIDEOAPI mocked contract
        run: python -m pytest -q tests/test_app_server.py tests/test_videoapi.py
      - name: Verify embedded studio JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("editor_ultra_app/ui.html").read_text(encoding="utf-8")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/editor-ultra-videoapi.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/editor-ultra-videoapi.js
