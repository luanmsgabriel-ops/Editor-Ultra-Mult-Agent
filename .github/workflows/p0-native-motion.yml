name: P0 native measured motion consumption

on:
  pull_request:
    paths:
      - "visual_fidelity/native_motion.py"
      - "visual_fidelity/video_anchor.py"
      - "editorial_engine/native.py"
      - "editorial_engine/project.py"
      - "editor_ultra_app/native_motion.py"
      - "editor_ultra_app/engine.py"
      - "editor_ultra_app/server.py"
      - "tests/test_native_motion_binding.py"
      - ".github/workflows/p0-native-motion.yml"

permissions:
  contents: read

jobs:
  native-real-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install -r requirements-app.txt
          python -m pip install -r requirements-dev.txt
      - name: Compile native and app
        run: python -m compileall -q editor_ultra_app editorial_engine visual_fidelity
      - name: Verify source to native encoded-pixel binding
        run: |
          python -m pytest -q             tests/test_native_motion_binding.py             tests/test_clone_resources.py             tests/test_motion_binding.py             tests/test_app_engine.py             tests/test_app_server.py
