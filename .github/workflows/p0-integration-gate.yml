name: P0 integrated motion and VIDEOAPI regression

on:
  pull_request:
    paths:
      - "editor_ultra_app/**"
      - "editorial_engine/scene_*.py"
      - "visual_fidelity/**"
      - "tests/test_app_*.py"
      - "tests/test_p0_integrated_flow.py"
      - "tests/test_motion_binding.py"
      - "tests/test_videoapi*.py"
      - ".github/workflows/p0-integration-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-contract-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Python deps
        run: |
          python -m pip install -r requirements-app.txt
          python -m pip install -r requirements-dev.txt
      - name: Install pinned Motion Lab
        run: npm ci --ignore-scripts --prefix editorial_engine/backends/motionlab
      - name: Compile integrated modules
        run: python -m compileall -q editor_ultra_app editorial_engine visual_fidelity
      - name: Verify v9 Studio and all UI handlers
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("editor_ultra_app/ui.html").read_text(encoding="utf-8")
          js = html.split("<script>", 1)[1].split("</script>", 1)[0]
          for name in ("compareNativeClone", "compareNativeCadence", "importVideoAPI"):
              assert "function " + name + "(" in js
          assert "videoapi-import" in js and "compare-temporal" in js
          Path("/tmp/editor-ultra-integrated.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/editor-ultra-integrated.js
      - name: Run combined synthetic real-media and auth tests
        run: |
          python -m pytest -q             tests/test_app_engine.py             tests/test_app_auth.py             tests/test_app_server.py             tests/test_app_motion.py             tests/test_app_motion_application.py             tests/test_motion_binding.py             tests/test_videoapi.py             tests/test_videoapi_import.py             tests/test_app_scene_orchestrator.py             tests/test_app_fidelity_bridge.py             tests/test_clone_resources.py             tests/test_reference_fidelity.py             tests/test_reference_temporal_qa.py             tests/test_app_uploads.py             tests/test_app_upload_ui.py             tests/test_p0_integrated_flow.py
  build-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Build combined deployment image without publishing
        run: docker build --tag editor-ultra-p0-staging-proof .
